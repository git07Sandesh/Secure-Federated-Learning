[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-first-federated-learning"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.18.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.2.0, < 2.6.0",
    "torchvision >= 0.17.0, < 0.21.0"
,
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "admin"

[tool.flwr.app.components]
serverapp = "my_first_federated_learning.server_app:app"
clientapp = "my_first_federated_learning.client_app:app"

[tool.flwr.app.config]
strategy = "FedMedian"
num-server-rounds = 3
fraction-fit = 0.5
local-epochs = 1

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10

[tool.flower.logging]
enable_wandb = true
